<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FA POS / DMS 比對工具</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{font-family:Arial,"Microsoft JhengHei",sans-serif;color:#222;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:22px;margin-bottom:18px}h1{margin:0 0 6px;font-size:26px}p{color:#666}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:14px}.upload{border:1px dashed #999;border-radius:10px;padding:18px}.upload b{display:block;margin-bottom:10px}input[type=file]{width:100%}button{border:0;border-radius:7px;padding:10px 16px;font-weight:700;cursor:pointer}.primary{background:#111;color:white}.secondary{background:#e9ecef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.status{font-size:14px;margin-top:8px;color:#555}.summary{display:flex;gap:20px;flex-wrap:wrap}.metric{min-width:160px}.metric strong{font-size:24px;display:block}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}select{padding:8px;border:1px solid #bbb;border-radius:6px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #ccc;padding:8px}th{background:#e7eef4;text-align:center}td.num{text-align:right}.neg{color:#b42318}.pos{color:#b54708}.ok{color:#18794e}.hint{font-size:13px;color:#777}.error{color:#b42318;font-weight:700}@media(max-width:720px){.uploads{grid-template-columns:1fr}.wrap{padding:0 10px}}
</style></head>
<body><main class="wrap">
<div class="card"><h1>FA POS / DMS 比對工具</h1><p>匯入財務 POS 與 DMS 送餐紀錄，自動依「餐廳＋日期」彙總並產出財務 Excel。檔案只在目前瀏覽器中處理，不會儲存到 GitHub。</p>
<div class="uploads"><div class="upload"><b>① 財務 POS Excel</b><input id="posFile" type="file" accept=".xlsx,.xls"><div id="posStatus" class="status">尚未匯入</div></div><div class="upload"><b>② DMS 送餐紀錄 Excel</b><input id="dmsFile" type="file" accept=".xlsx,.xls"><div id="dmsStatus" class="status">尚未匯入</div></div></div>
<div class="actions"><button id="compareBtn" class="primary">開始比對</button><button id="resetBtn" class="secondary">清除</button></div><div id="msg" class="status"></div></div>
<div id="result" class="card" hidden><div class="summary"><div class="metric"><span>差異筆數</span><strong id="diffCount">0</strong></div><div class="metric"><span>未輸入 FA</span><strong id="missingCount">0</strong></div><div class="metric"><span>多輸入須扣回</span><strong id="overCount">0</strong></div></div><hr>
<div class="filters"><label>顯示 <select id="filter"><option value="diff">僅有差異</option><option value="all">全部</option><option value="missing">未輸入FA</option><option value="over">多輸入須扣回</option></select></label><button id="exportBtn" class="primary">匯出財務 Excel</button></div>
<div class="hint">差異 = POS金額 − DMS金額；負數＝未輸入FA；正數＝多輸入須扣回；0＝無差異。</div><div style="overflow:auto;margin-top:10px"><table><thead><tr><th>餐廳名稱</th><th>日期</th><th>POS金額</th><th>DMS金額</th><th>差異</th><th>備註</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
</main><script src="fa-compare.js"></script></body></html>
